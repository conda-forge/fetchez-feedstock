schema_version: 1

context:
  name: fetchez
  python_min: "3.12"
  version: "0.12.2"
  build_number: 0
  sha256: "b4f912f384a47b799306d9c510f12d5dfc0565f30671985f361ea02e05bd7335"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: ${{ build_number }}
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - fetchez = fetchez.cli:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.5.0
    - hatch-vcs
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - requests >=2.31.0
    - lxml >=4.9.3
    - tqdm >=4.66.0
    - shapely >=2.0.3
    - pyyaml >=6.0.1
    - click >=8.1.7
    - pyproj >=3.6.1
    - pyogrio >=0.8.0
    - filelock >=3.12.4
    - mercantile
    - boto3
    - copernicusmarine
    - rasterio

tests:
  - python:
      python_version:
        - "${{ python_min }}.*"
        - "*"
      pip_check: true
      imports:
        - fetchez
  - script:
      - fetchez --help
      - fetchez modules list
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/ciresdem/fetchez
  summary: |
    Fetchez is a lightweight, modular Python library and command-line tool
    designed to discover and download geospatial data from a wide variety of
    public repositories.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - matth-love
    - mfisher87
